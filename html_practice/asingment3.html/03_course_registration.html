<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Course Registration</title></head>
<body>
<h1>Course Registration Form</h1>
<form>
  <fieldset>
    <legend>Student Information</legend>
    <label>Name: <input type="text" name="name"></label><br><br>
    <label>Email: <input type="email" name="email"></label><br><br>
    <label>Select Course:
      <select name="course">
        <option>Web Development</option><option>Database Management</option><option>Java Programming</option>
      </select>
    </label><br><br>
    <input type="submit" value="Register">
  </fieldset>
</form>
<h2>Available Course Schedules</h2>
<table border="1">
<tr><th>Day</th><th>Time</th><th>Instructor</th></tr>
<tr><td>Monday</td><td>10:00 AM</td><td>Mr. Sharma</td></tr>
<tr><td>Wednesday</td><td>12:00 PM</td><td>Ms. Gupta</td></tr>
<tr><td>Friday</td><td>2:00 PM</td><td>Mr. Singh</td></tr>
</table>
</body>
</html>
